name: sevanest_customer
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  razorpay_flutter: ^1.4.7
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  geocoding_platform_interface: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
  assets:
    - assets/branding/logo_full.png
    - assets/branding/logo_mark.png
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

